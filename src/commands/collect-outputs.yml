description: >
  Reads back whatever KEY=value lines the pipe appended to its output-variables file and exports
  each one, verbatim, into $BASH_ENV for later native CircleCI steps to read. A no-op if the
  pipe never wrote to that file, which is normal -- most official pipes don't (see the README).

parameters:
  output-file:
    type: string
    default: /tmp/bitbucket-pipe-scratch/pipe-output.env
    description: Host-side path of the pipe's output-variables file (see `create-output-file`).
  step-name:
    type: string
    default: Collect Bitbucket pipe outputs
    description: Allows for customizing the name of this step.

steps:
  - run:
      name: << parameters.step-name >>
      environment:
        ORB_VAL_OUTPUT_FILE: << parameters.output-file >>
      command: <<include(scripts/collect-outputs.sh)>>
