description: |
  Run a credential-free Bitbucket pipe as its own job. `bitbucketpipelines/demo-pipe-bash` is
  Atlassian's own official docker-run example pipe -- it requires one variable (`NAME`) and
  needs no secrets, so this example doubles as this orb's CI integration test.

usage:
  version: 2.1
  orbs:
    bitbucket: cci-labs/bitbucket@x.y.z
  workflows:
    main:
      jobs:
        - bitbucket/pipe:
            name: "Greet with demo-pipe-bash"
            image: bitbucketpipelines/demo-pipe-bash:0.1.0
            variables: |
              NAME=Mona Octocat
              DEBUG=true
