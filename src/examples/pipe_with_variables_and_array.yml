description: |
  Run a pipe that takes secrets and a genuine array-typed variable, using the `pipe` command
  inline among native steps. `CAPABILITIES` is a real, documented array input of
  `atlassian/aws-cloudformation-deploy` (real Docker image:
  `bitbucketpipelines/aws-cloudformation-deploy`), written here as a bracket list -- exactly the
  syntax a Bitbucket pipeline author already types for this pipe (`CAPABILITIES: ['CAPABILITY_IAM',
  'CAPABILITY_AUTO_EXPAND']` in `bitbucket-pipelines.yml`). `run-pipe` flattens that into
  Bitbucket's own `_COUNT`/`_0`/`_1`/... convention itself, so you never hand-count array items.
  `$AWS_ACCESS_KEY_ID` etc. are resolved by `circleci env subst` against real context/project env
  vars, so no secret value ever enters this config. Native steps before and after the pipe step
  run exactly as they would in any other job -- this is the one-pipe-per-call, native-everywhere-
  else model this orb is built around.

usage:
  version: 2.1
  orbs:
    bitbucket: cci-labs/bitbucket@x.y.z
  jobs:
    deploy:
      machine:
        image: ubuntu-2404:current
      steps:
        - checkout
        - bitbucket/pipe:
            image: bitbucketpipelines/aws-cloudformation-deploy:0.22.0
            variables: |
              AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION=us-east-1
              TEMPLATE=cloudformation/template.yml
              CAPABILITIES=['CAPABILITY_IAM', 'CAPABILITY_AUTO_EXPAND']
        - run:
            name: Native step after the pipe
            command: echo "Deployed; continuing with native CircleCI steps."
  workflows:
    main:
      jobs:
        - deploy
