description: >
  Default executor for running a Bitbucket Pipe. Must be a `machine` executor: pipes expect
  their workspace bind-mounted at $BITBUCKET_CLONE_DIR, and CircleCI's `docker` executor (with
  `setup_remote_docker`) runs its Docker daemon in a separate remote VM with no shared
  filesystem, so bind mounts silently do not work there -- CircleCI's own docs say to use
  `docker cp` instead. See the README's "What does not work" section for why this orb does not
  offer a `docker` executor.

parameters:
  image:
    type: string
    default: ubuntu-2404:current
    description: The machine image to run the pipe's Docker container on.
  resource_class:
    type: string
    default: medium
    description: >
      The resource class for the executor. Bitbucket's own hosted runners default to 4 CPU /
      8GB (their "1x" size); pick a resource class to match if a pipe is resource-hungry.
  docker_layer_caching:
    type: boolean
    default: false
    description: >
      Enables CircleCI's Docker Layer Caching. DLC caches `docker build` layer output; it is not
      a cache for `docker pull`. This orb never builds an image (it only `docker run`s a
      pre-built vendor pipe image), so DLC has nothing of its own to cache here -- confirmed by
      measurement, not just mechanism: against bitbucketpipelines/aws-ecs-deploy:1.15.0
      (~68.5MB, the largest real pipe image sampled for this orb), two independent real-CircleCI
      runs showed no measurable pull-time improvement from DLC, while DLC itself added ~3.4s of
      spin-up/teardown overhead on top of its billed, plan-gated cost. Defaults to false
      accordingly; there is also no separate save_cache/restore_cache image-pull caching
      mechanism in this orb, since it would face the identical tradeoff. See
      docs/ROADMAP.md's "Image caching economics" section for the measured numbers and job
      references, and docs/LIMITS.md's "Caching the pipe image" section for user-facing
      guidance, including the one case (your own `pre-steps`/`post-steps` building an image)
      where DLC would genuinely help.

machine:
  image: << parameters.image >>
  docker_layer_caching: << parameters.docker_layer_caching >>
resource_class: << parameters.resource_class >>
