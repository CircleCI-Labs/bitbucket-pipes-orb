description: >
  Runs one Bitbucket Pipe as its own job, callable directly from a workflow. Same contract as
  the `pipe` command. Like every CircleCI 2.1+ job, this job accepts the platform's own built-in
  `pre-steps`/`post-steps` job-invocation arguments for interleaving your own native steps around
  it -- pass them at the call site (e.g. `- bitbucket/pipe: {pre-steps: [...], ...}`), no orb-side
  declaration needed. Note the platform's own semantics: pre-steps run before *every* step in
  this job, including this job's own `checkout`, not just before the pipe -- see the README.

parameters:
  executor:
    type: executor
    default: default
    description: The executor to run the pipe on. Must be a `machine` executor -- see the README.
  checkout:
    type: boolean
    default: true
    description: Checkout the CircleCI repository before running the pipe.
  image:
    type: string
    description: >
      The pipe's Docker image reference, passed to `docker run` verbatim (e.g.
      `bitbucketpipelines/aws-ecs-deploy:1.15.0`). No version resolution is performed -- Docker's
      own default (`:latest` when no tag is given) applies. Pin by digest
      (`bitbucketpipelines/aws-ecs-deploy@sha256:...`) for a reproducible build -- see
      "Immutable pinning" in the README.
  variables:
    type: string
    default: ""
    description: >
      The pipe's `variables:` block as multi-line KEY=value pairs, using Bitbucket's own literal
      variable-naming convention (no prefix, no case change). Array variables can be written
      either as Bitbucket's own flat indexed convention typed out by hand, or as a bracket list
      matching the exact syntax a Bitbucket pipeline author already writes
      (SOME_VAR=['first', 'second']), which this orb flattens itself. Runs through `circleci env
      subst`, so values may reference $MY_SECRET without the secret ever entering this
      parameter's own value.
  skip-map-env:
    type: boolean
    default: false
    description: >
      Skip mapping CircleCI's build context onto BITBUCKET_* variables. Most pipes -- even
      "credential-free" ones -- read at least BITBUCKET_REPO_OWNER and crash without it.
  extra-env-mapping:
    type: string
    default: ""
    description: >
      Multi-line BITBUCKET_VAR=value pairs to add on top of, or override entries in, the
      built-in CIRCLE_*->BITBUCKET_* mapping. Applied last, so these win. Runs through
      `circleci env subst`.
  clone-dir:
    type: string
    default: /opt/atlassian/pipelines/agent/build
    description: >
      Container-side path the checkout is bind-mounted at ($BITBUCKET_CLONE_DIR) -- the path
      pipes expect their workspace to be at.
  output-file:
    type: string
    default: /tmp/bitbucket-pipe-scratch/pipe-output.env
    description: Host-side path for the pipe's output-variables file.
  pipe-storage-dir:
    type: string
    default: /tmp/bitbucket-pipe-scratch/storage
    description: Host-side scratch directory mapped to BITBUCKET_PIPE_STORAGE_DIR.
  pipe-shared-storage-dir:
    type: string
    default: /tmp/bitbucket-pipe-scratch/shared-storage
    description: Host-side scratch directory mapped to BITBUCKET_PIPE_SHARED_STORAGE_DIR.
  user:
    type: string
    default: ""
    description: >
      Optional `--user` value (e.g. `1000:1000`) for `docker run`. Left empty by default: pipe
      containers run as root by default, matching Bitbucket's own real-world behavior.
  fix-permissions:
    type: boolean
    default: false
    description: >
      After the pipe container exits, chown the checkout back to the CircleCI user, undoing
      root-owned files the pipe container may have left behind. Off by default.
  extra-docker-args:
    type: string
    default: ""
    description: >
      Additional flags appended to the `docker run` invocation, before the image reference.
      Simple whitespace-split -- no quoting support for values containing spaces. If you use
      this to pass `--network host`: that collapses the pipe container into the job VM's own
      network namespace, so it can then reach anything bound to the job's own loopback (a mock
      server, a database the job started, a cloud metadata endpoint) that it otherwise
      couldn't -- a real trust-boundary change, not just a networking convenience.
  registry-username:
    type: env_var_name
    default: BITBUCKET_PIPE_REGISTRY_USERNAME
    description: >
      Name of the env var (project or context env var) holding the registry username for a
      private image, if any. Left at its default, unset value this resolves to empty and
      registry login is skipped.
  registry-password:
    type: env_var_name
    default: BITBUCKET_PIPE_REGISTRY_PASSWORD
    description: >
      Name of the env var (project or context env var) holding the registry password/token for
      a private image, if any.
  registry-server:
    type: string
    default: ""
    description: Registry server/host to log in to. Leave empty for Docker Hub.
  step-name:
    type: string
    default: Run Bitbucket pipe
    description: Allows for customizing the name of the `docker run` step specifically.
  store-test-results:
    type: boolean
    default: true
    description: >
      Automatically run `store_test_results` against the checkout root after the pipe --
      see the `pipe` command's own parameter description for the full rationale
      (real Bitbucket's 5-glob test-report scan, and why there's no artifacts
      equivalent). Disable if you'd rather call `store_test_results` yourself, e.g. via
      `post-steps:`.

executor: << parameters.executor >>

steps:
  - when:
      condition: << parameters.checkout >>
      steps:
        - checkout
  - pipe:
      checkout: false
      image: << parameters.image >>
      variables: << parameters.variables >>
      skip-map-env: << parameters.skip-map-env >>
      extra-env-mapping: << parameters.extra-env-mapping >>
      clone-dir: << parameters.clone-dir >>
      output-file: << parameters.output-file >>
      pipe-storage-dir: << parameters.pipe-storage-dir >>
      pipe-shared-storage-dir: << parameters.pipe-shared-storage-dir >>
      user: << parameters.user >>
      fix-permissions: << parameters.fix-permissions >>
      extra-docker-args: << parameters.extra-docker-args >>
      registry-username: << parameters.registry-username >>
      registry-password: << parameters.registry-password >>
      registry-server: << parameters.registry-server >>
      step-name: << parameters.step-name >>
      store-test-results: << parameters.store-test-results >>
